<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Something Waiting For You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,500&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#060000;font-family:'Raleway',sans-serif;}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}

/* ══ UI LAYOUT ══ */
.ui{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;
  padding-top:5%;
}

/* ══ ORB ══ */
.orb-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
}
.orb-ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(215,168,45,0.18);
  animation:rp 4.5s ease-in-out infinite;
  pointer-events:none;
}
.orb-ring.r1{width:150px;height:150px;border-color:rgba(215,168,45,0.4);}
.orb-ring.r2{width:188px;height:188px;animation-delay:1.1s;opacity:.38;}
.orb-ring.r3{width:226px;height:226px;animation-delay:2.2s;opacity:.16;}
@keyframes rp{
  0%,100%{transform:scale(1);opacity:.18;}
  50%{transform:scale(1.04);opacity:.82;}
}

.orb{
  width:134px;height:134px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 25%, rgba(120,10,40,0.9) 0%, rgba(65,5,18,0.95) 35%, rgba(18,0,5,1) 70%);
  border:1px solid rgba(218,165,42,0.5);
  box-shadow:
    0 0 0 4px rgba(218,165,42,0.06),
    0 0 45px rgba(185,0,32,.5),
    0 0 90px rgba(185,0,32,.18),
    0 14px 44px rgba(0,0,0,.65),
    inset 0 0 35px rgba(0,0,0,.95),
    inset 0 2px 0 rgba(255,232,155,.07);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
  cursor:pointer;position:relative;z-index:2;
  transition:all .42s ease;
  padding:0 14px;
}
.orb:hover{
  border-color:rgba(218,165,42,0.8);
  box-shadow:
    0 0 0 4px rgba(218,165,42,0.1),
    0 0 65px rgba(215,12,48,.7),
    0 0 120px rgba(215,12,48,.22),
    0 14px 44px rgba(0,0,0,.65),
    inset 0 0 35px rgba(0,0,0,.95),
    inset 0 2px 0 rgba(255,232,155,.12);
  transform:scale(1.055);
}
.orb:active{transform:scale(0.96);}

/* glass glint on orb */
.orb::before{
  content:'';
  position:absolute;top:14px;left:50%;
  transform:translateX(-50%);
  width:52%;height:26%;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,232,160,.09) 0%, transparent 80%);
  border-radius:50%;pointer-events:none;
}

.orb-rose{
  font-size:20px;line-height:1;
  animation:rg 3.2s ease-in-out infinite;
}
@keyframes rg{
  0%,100%{filter:drop-shadow(0 0 4px rgba(255,120,100,.4));}
  50%{filter:drop-shadow(0 0 20px rgba(255,120,100,1));}
}

.orb-text{
  font-family:'Cormorant Garamond',serif;
  font-size:10px;
  font-weight:400;
  font-style:italic;
  letter-spacing:.13em;
  color:rgba(255,225,195,.92);
  text-align:center;
  line-height:1.7;
  text-shadow:0 0 16px rgba(230,65,45,.5), 0 1px 2px rgba(0,0,0,.6);
  pointer-events:none;
}

/* ══ ELEGANT DIVIDER ══ */
.divider{
  display:flex;align-items:center;gap:12px;
  width:min(200px,52vw);
  opacity:.65;
}
.divider-line{
  flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,162,42,.6),transparent);
}
.divider-gem{
  font-size:8px;color:rgba(218,168,45,.9);
  animation:gp 3.5s ease-in-out infinite;
}
@keyframes gp{
  0%,100%{opacity:.35;transform:scale(1);}
  50%{opacity:1;transform:scale(1.25);}
}

/* ══ COUNTDOWN CARD ══ */
.countdown-card{
  position:relative;
  border:1px solid rgba(212,162,42,0.22);
  border-radius:18px;
  padding:18px 36px 16px;
  background:rgba(3,0,0,0.82);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  text-align:center;
  min-width:min(250px,74vw);
  animation:pg 4s ease-in-out infinite;
}
/* corner brackets */
.countdown-card::before,.countdown-card::after{
  content:'';position:absolute;
  width:13px;height:13px;
  border-color:rgba(212,162,42,.38);
  border-style:solid;
}
.countdown-card::before{top:7px;left:7px;border-width:1.5px 0 0 1.5px;border-radius:2px 0 0 0;}
.countdown-card::after {bottom:7px;right:7px;border-width:0 1.5px 1.5px 0;border-radius:0 0 2px 0;}

/* inner shimmer */
.countdown-card .shine{
  position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,230,140,.04) 0%,transparent 55%);
  pointer-events:none;
}

@keyframes pg{
  0%,100%{box-shadow:0 6px 32px rgba(0,0,0,.6), 0 0 14px rgba(110,0,12,.2);}
  50%{box-shadow:0 6px 32px rgba(0,0,0,.6), 0 0 36px rgba(185,0,24,.32), 0 0 12px rgba(212,162,42,.08);}
}

.pill-label{
  font-family:'Raleway',sans-serif;
  font-size:7px;font-weight:300;
  letter-spacing:.38em;
  color:rgba(255,225,192,.38);
  text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:4px;
}
.pill-label .si{color:rgba(212,162,42,.75);font-size:8px;}

.pill-divline{
  width:60px;height:1px;margin:6px auto 8px;
  background:linear-gradient(90deg,transparent,rgba(212,162,42,.3),transparent);
}

.pill-time{
  font-family:'Cormorant Garamond',serif;
  font-size:27px;font-weight:300;
  color:#f2283e;
  letter-spacing:.1em;
  text-shadow:
    0 0 26px rgba(242,40,62,.75),
    0 0 8px rgba(242,40,62,.35),
    0 2px 6px rgba(0,0,0,.55);
}

/* ══ DATE SETTER ══ */
.bday-form{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);z-index:11;
  display:flex;flex-direction:column;align-items:center;gap:7px;
}
.bday-form label{
  font-family:'Raleway',sans-serif;
  font-size:6.5px;font-weight:300;
  letter-spacing:.38em;
  color:rgba(255,218,178,.2);
  text-transform:uppercase;
}
.bday-form input[type="date","time"]{
  background:rgba(3,0,0,.94);
  border:1px solid rgba(205,155,38,.2);
  border-radius:30px;
  padding:7px 20px;
  color:#f0e2cc;
  font-family:'Raleway',sans-serif;
  font-size:9.5px;letter-spacing:.15em;
  outline:none;text-align:center;cursor:pointer;
  transition:border-color .45s,box-shadow .45s;
  min-width:180px;
}
.bday-form input[type="date","time"]:focus{
  border-color:rgba(205,155,38,.5);
  box-shadow:0 0 16px rgba(205,155,38,.14);
}
.bday-form input[type="date","time"]::-webkit-calendar-picker-indicator{
  filter:invert(60%) sepia(55%) saturate(370%) hue-rotate(14deg);cursor:pointer;
}

/* ══ REVEAL OVERLAY ══ */
.reveal-overlay{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse 88% 88% at 50% 52%,#2e000e 0%,#070000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;
  opacity:0;pointer-events:none;transition:opacity 1.5s ease;
}
.reveal-overlay.active{opacity:1;pointer-events:all;}

.reveal-roses{
  font-size:32px;
  animation:rb 2s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(225,60,60,.65));
}
@keyframes rb{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}

.reveal-card{
  border:1px solid rgba(212,162,42,.22);
  border-radius:20px;
  padding:28px 40px 24px;
  background:rgba(5,0,0,.78);
  backdrop-filter:blur(22px);
  text-align:center;
  position:relative;
  max-width:min(310px,84vw);
}
.reveal-card::before,.reveal-card::after{
  content:'';position:absolute;
  width:16px;height:16px;
  border-color:rgba(212,162,42,.38);border-style:solid;
}
.reveal-card::before{top:9px;left:9px;border-width:1.5px 0 0 1.5px;border-radius:2px 0 0 0;}
.reveal-card::after{bottom:9px;right:9px;border-width:0 1.5px 1.5px 0;border-radius:0 0 2px 0;}

.reveal-divline{
  width:70px;height:1px;margin:10px auto;
  background:linear-gradient(90deg,transparent,rgba(212,162,42,.42),transparent);
}
.reveal-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(26px,7.5vw,50px);
  font-weight:300;
  color:#fff6f2;line-height:1.22;letter-spacing:.03em;
}
.reveal-title em{
  color:#f2283e;font-style:italic;
  text-shadow:0 0 28px rgba(242,40,62,.65);
}
.reveal-sub{
  font-family:'Raleway',sans-serif;
  font-size:8px;font-weight:300;
  letter-spacing:.36em;
  color:rgba(255,222,188,.35);
  text-transform:uppercase;
  margin-top:4px;
}
.close-reveal{
  font-family:'Raleway',sans-serif;
  font-size:7.5px;font-weight:300;
  letter-spacing:.38em;
  color:rgba(255,218,178,.28);
  text-transform:uppercase;
  cursor:pointer;
  border:1px solid rgba(205,155,38,.18);
  border-radius:24px;
  padding:7px 22px;
  transition:all .38s ease;
  margin-top:4px;
}
.close-reveal:hover{
  color:rgba(255,218,178,.68);
  border-color:rgba(205,155,38,.45);
  box-shadow:0 0 14px rgba(205,155,38,.12);
  letter-spacing:.44em;
}

</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui">
  <div class="orb-wrap">
    <div class="orb-ring r3"></div>
    <div class="orb-ring r2"></div>
    <div class="orb-ring r1"></div>
    <div class="orb" id="orbBtn">
      <div class="orb-rose">🌹</div>
      <div class="orb-text">something is<br>waiting for<br>you to see</div>
    </div>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-gem">✦</div>
    <div class="divider-line"></div>
  </div>

  <div class="countdown-card">
    <div class="shine"></div>
    <div class="pill-label">
      <span class="si">✦</span> waits until your birthday <span class="si">✦</span>
    </div>
    <div class="pill-divline"></div>
    <div class="pill-time" id="countdownDisplay">-- -- -- --</div>
  </div>
</div>

<div class="bday-form">
  <label for="bdayInput">set birthday</label>
  <input type="date" id="bdayInput"/>
</div>
<div id="timeSetup">
  <input 
    type="datetime-local" 
    id="targetInput"
  >
  <button onclick="startCountdown()">
    Start Countdown
  </button>
</div>

<div id="countdown"></div>
<div class="reveal-overlay" id="revealOverlay">
  <div class="reveal-roses">🌹 ♥ 🌹</div>
  <div class="reveal-card">
    <div class="reveal-title">Happy <em>Birthday,</em><br>my solace ♥</div>
    <div class="reveal-divline"></div>
    <div class="reveal-sub">My Princess, my solace, wishing you all the peace prosperity and happiness in the world. Always be safe and healthy!! Love you my princess🎂🎂🎉🎊🎊💐🎁👑💝.</div>
  </div>
  <div class="close-reveal" id="closeReveal">✦ &nbsp; close &nbsp; ✦</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// ─── SCENE DRAW ────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawCurtains();
  drawFloor();
  drawArch();
  drawAllRoses();
  drawChandelier();
  drawVignette();
}

// ─── BACKGROUND ────────────────────────────────────────────────
function drawBg(){
  // Warm dark room
  const g = ctx.createRadialGradient(W/2, H*0.25, 0, W/2, H*0.5, H*1.1);
  g.addColorStop(0,'#340008');
  g.addColorStop(0.3,'#1e0004');
  g.addColorStop(0.7,'#0e0001');
  g.addColorStop(1,'#040000');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // Room back wall warm centre glow
  const wg = ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,W*0.35);
  wg.addColorStop(0,'rgba(100,8,12,0.28)');
  wg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0,0,W,H);
}

// ─── CURTAINS ──────────────────────────────────────────────────
function drawCurtains(){
  drawCurtain('left');
  drawCurtain('right');
}

function drawCurtain(side){
  const cw = W * 0.30;
  const x  = side==='left' ? 0 : W - cw;
  // inner edge angle: curtain pulls back at bottom
  const innerTopX = side==='left' ? x+cw : x;
  const innerBotX = side==='left' ? x+cw*0.72 : x+cw*0.28;

  ctx.save();
  ctx.beginPath();
  if(side==='left'){
    ctx.moveTo(x,0); ctx.lineTo(innerTopX,0);
    ctx.lineTo(innerBotX,H); ctx.lineTo(x,H);
  } else {
    ctx.moveTo(innerTopX,0); ctx.lineTo(x+cw,0);
    ctx.lineTo(x+cw,H); ctx.lineTo(innerBotX,H);
  }
  ctx.closePath();
  ctx.clip();

  // Base velvet colour
  const vg = ctx.createLinearGradient(x,0,x+cw,0);
  if(side==='left'){
    vg.addColorStop(0,'#5a000c');
    vg.addColorStop(0.25,'#8c0018');
    vg.addColorStop(0.55,'#6e000f');
    vg.addColorStop(0.78,'#a50020');
    vg.addColorStop(1,'#5a000c');
  } else {
    vg.addColorStop(0,'#5a000c');
    vg.addColorStop(0.22,'#a50020');
    vg.addColorStop(0.45,'#6e000f');
    vg.addColorStop(0.75,'#8c0018');
    vg.addColorStop(1,'#5a000c');
  }
  ctx.fillStyle = vg;
  ctx.fillRect(x,0,cw,H);

  // Velvet sheen folds
  const folds = 9;
  for(let i=0;i<folds;i++){
    const fx = x + (cw/(folds+1))*(i+1);
    const fw = cw*0.028;
    // highlight
    const hg = ctx.createLinearGradient(fx-fw,0,fx+fw*0.5,0);
    hg.addColorStop(0,'rgba(0,0,0,0)');
    hg.addColorStop(0.4,'rgba(255,100,100,0.07)');
    hg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=hg; ctx.fillRect(fx-fw,0,fw*2,H);
    // shadow
    const sg = ctx.createLinearGradient(fx+fw*0.3,0,fx+fw*2.2,0);
    sg.addColorStop(0,'rgba(0,0,0,0.22)');
    sg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sg; ctx.fillRect(fx+fw*0.3,0,fw*2,H);
  }

  // Top gather darkness
  const tg = ctx.createLinearGradient(0,0,0,H*0.08);
  tg.addColorStop(0,'rgba(0,0,0,0.6)');
  tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg; ctx.fillRect(x,0,cw,H*0.08);

  // Bottom darkening
  const bg2 = ctx.createLinearGradient(0,H*0.8,0,H);
  bg2.addColorStop(0,'rgba(0,0,0,0)');
  bg2.addColorStop(1,'rgba(0,0,0,0.45)');
  ctx.fillStyle=bg2; ctx.fillRect(x,0,cw,H);

  ctx.restore();

  // Gold inner edge trim
  const trimX = side==='left' ? innerBotX : innerBotX;
  const trimT  = side==='left' ? innerTopX : innerTopX;
  const tg2 = ctx.createLinearGradient(0,0,0,H);
  tg2.addColorStop(0,'rgba(255,230,120,0.85)');
  tg2.addColorStop(0.4,'rgba(210,160,40,0.65)');
  tg2.addColorStop(1,'rgba(130,90,15,0.4)');
  ctx.strokeStyle=tg2; ctx.lineWidth=3.5;
  ctx.beginPath(); ctx.moveTo(trimT,0); ctx.lineTo(trimX,H); ctx.stroke();
  // soft glow behind trim
  ctx.strokeStyle=`rgba(255,200,80,0.12)`; ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(trimT,0); ctx.lineTo(trimX,H); ctx.stroke();
}

// ─── FLOOR / CARPET ────────────────────────────────────────────
function drawFloor(){
  const cy   = H * 0.78;
  const cx   = W / 2;
  const topW = W * 0.26;
  const botW = W * 0.92;

  // Side floor panels (cream-ish)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx-botW/2,H); ctx.lineTo(cx-topW/2,cy);
  ctx.lineTo(cx+topW/2,cy); ctx.lineTo(cx+botW/2,H);
  ctx.closePath();
  const flg = ctx.createLinearGradient(0,cy,0,H);
  flg.addColorStop(0,'#c8a060');
  flg.addColorStop(0.15,'#b08040');
  flg.addColorStop(1,'#604010');
  ctx.fillStyle=flg; ctx.fill();
  ctx.restore();

  // Red carpet trapezoid
  ctx.save();
  const ctopW = W * 0.18;
  const cbotW = W * 0.44;
  ctx.beginPath();
  ctx.moveTo(cx-ctopW/2,cy); ctx.lineTo(cx+ctopW/2,cy);
  ctx.lineTo(cx+cbotW/2,H);  ctx.lineTo(cx-cbotW/2,H);
  ctx.closePath();

  const crg = ctx.createLinearGradient(0,cy,0,H);
  crg.addColorStop(0,'#b00022');
  crg.addColorStop(0.25,'#cc0028');
  crg.addColorStop(0.6,'#a80020');
  crg.addColorStop(1,'#720014');
  ctx.fillStyle=crg; ctx.fill();

  // carpet texture
  for(let i=1;i<14;i++){
    const t=i/14;
    const y=cy+(H-cy)*t;
    const hw=lerp(ctopW/2,cbotW/2,t);
    ctx.strokeStyle=`rgba(0,0,0,${0.06+t*0.05})`;
    ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(cx-hw,y); ctx.lineTo(cx+hw,y); ctx.stroke();
  }
  // carpet centre line
  ctx.strokeStyle='rgba(180,0,30,0.4)';ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,H); ctx.stroke();
  ctx.restore();

  // Gold carpet border
  ctx.save();
  [{o:0,a:0.92},{o:4,a:0.57}].forEach(({o,a})=>{
    const y1=cy+o, hw1=lerp(ctopW/2,cbotW/2,o/(H-cy));
    const y2=H-o,  hw2=cbotW/2;
    ctx.strokeStyle=`rgba(215,170,50,${a})`; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(cx-(cbotW/2+o),H-o);
    ctx.lineTo(cx-(ctopW/2+o),cy+o);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+(cbotW/2+o),H-o);
    ctx.lineTo(cx+(ctopW/2+o),cy+o);
    ctx.stroke();
  });
  ctx.restore();

  // Floor glow
  const fg = ctx.createRadialGradient(cx,H,0,cx,H,W*0.38);
  fg.addColorStop(0,'rgba(160,10,30,0.22)');
  fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
}

// ─── ARCH ──────────────────────────────────────────────────────
function drawArch(){
  const cx   = W/2;
  const pilH = H * 0.60;
  const pilTop = H * 0.28;
  const archR  = W * 0.195; // radius of arch curve
  const pilW   = W * 0.045;
  const lx     = cx - archR - pilW/2;
  const rx     = cx + archR - pilW/2;

  // ── Dark interior of arch ──
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, pilTop, archR, Math.PI, 0, false);
  ctx.lineTo(rx+pilW, pilTop+pilH);
  ctx.lineTo(lx, pilTop+pilH);
  ctx.closePath();
  const ig2 = ctx.createRadialGradient(cx,pilTop+pilH*0.3,0,cx,pilTop+pilH*0.3,archR*1.4);
  ig2.addColorStop(0,'#1c0004');
  ig2.addColorStop(0.5,'#120002');
  ig2.addColorStop(1,'#080001');
  ctx.fillStyle=ig2; ctx.fill();
  ctx.restore();

  // ── Gold gradient helper ──
  function gold(x1,y1,x2,y2){
    const g=ctx.createLinearGradient(x1,y1,x2,y2);
    g.addColorStop(0,'#5a3808');
    g.addColorStop(0.12,'#c89228');
    g.addColorStop(0.28,'#f0d060');
    g.addColorStop(0.42,'#fff090');
    g.addColorStop(0.55,'#f5d868');
    g.addColorStop(0.70,'#c89228');
    g.addColorStop(0.85,'#a07020');
    g.addColorStop(1,'#5a3808');
    return g;
  }

  // ── Left pillar ──
  const lgrad = ctx.createLinearGradient(lx,0,lx+pilW,0);
  lgrad.addColorStop(0,'#4a2c06'); lgrad.addColorStop(0.2,'#d4a030');
  lgrad.addColorStop(0.45,'#ffe880'); lgrad.addColorStop(0.65,'#c89228');
  lgrad.addColorStop(1,'#4a2c06');
  ctx.fillStyle=lgrad; ctx.fillRect(lx,pilTop,pilW,pilH);

  // pillar decorative bands
  [0.10,0.28,0.48,0.68,0.85].forEach(t=>{
    const y=pilTop+pilH*t;
    const bg=ctx.createLinearGradient(lx,0,lx+pilW,0);
    bg.addColorStop(0,'rgba(0,0,0,0)'); bg.addColorStop(0.5,'rgba(255,245,160,0.55)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg; ctx.fillRect(lx,y-3,pilW,6);
  });
  // pillar edge highlights
  ctx.strokeStyle='rgba(255,240,160,0.3)'; ctx.lineWidth=1;
  ctx.strokeRect(lx,pilTop,pilW,pilH);

  // ── Right pillar ──
  const rgrad = ctx.createLinearGradient(rx,0,rx+pilW,0);
  rgrad.addColorStop(0,'#4a2c06'); rgrad.addColorStop(0.2,'#d4a030');
  rgrad.addColorStop(0.45,'#ffe880'); rgrad.addColorStop(0.65,'#c89228');
  rgrad.addColorStop(1,'#4a2c06');
  ctx.fillStyle=rgrad; ctx.fillRect(rx,pilTop,pilW,pilH);
  [0.10,0.28,0.48,0.68,0.85].forEach(t=>{
    const y=pilTop+pilH*t;
    const bg=ctx.createLinearGradient(rx,0,rx+pilW,0);
    bg.addColorStop(0,'rgba(0,0,0,0)'); bg.addColorStop(0.5,'rgba(255,245,160,0.55)'); bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg; ctx.fillRect(rx,y-3,pilW,6);
  });
  ctx.strokeStyle='rgba(255,240,160,0.3)'; ctx.lineWidth=1;
  ctx.strokeRect(rx,pilTop,pilW,pilH);

  // ── Arch curve (thick gold stroke) ──
  ctx.save();
  ctx.lineWidth = pilW * 1.05;
  ctx.strokeStyle = gold(lx,0,rx+pilW,0);
  ctx.beginPath();
  ctx.arc(cx, pilTop, archR + pilW*0.02, Math.PI, 0, false);
  ctx.stroke();
  // Inner arch line highlight
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,248,180,0.45)';
  ctx.beginPath(); ctx.arc(cx,pilTop,archR-pilW*0.42,Math.PI,0,false); ctx.stroke();
  // Outer shadow
  ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.arc(cx,pilTop,archR+pilW*0.55,Math.PI,0,false); ctx.stroke();
  ctx.restore();

  // ── Keystone crest ──
  const kx=cx, ky=pilTop-archR;
  ctx.save(); ctx.translate(kx,ky);
  // main crest shape
  ctx.beginPath();
  ctx.moveTo(-20,pilW*0.5);
  ctx.lineTo(-12,-10); ctx.lineTo(-6,-22);
  ctx.lineTo(0,-30); ctx.lineTo(6,-22);
  ctx.lineTo(12,-10); ctx.lineTo(20,pilW*0.5);
  ctx.lineTo(14,pilW*0.7); ctx.lineTo(-14,pilW*0.7);
  ctx.closePath();
  const kg=ctx.createLinearGradient(-20,-30,20,pilW);
  kg.addColorStop(0,'#fff090'); kg.addColorStop(0.4,'#e8c040'); kg.addColorStop(1,'#7a4e10');
  ctx.fillStyle=kg; ctx.fill();
  // jewel
  ctx.beginPath(); ctx.arc(0,-14,6,0,Math.PI*2);
  ctx.fillStyle='#fff5c0'; ctx.fill();
  ctx.beginPath(); ctx.arc(0,-14,3,0,Math.PI*2);
  ctx.fillStyle='rgba(255,220,100,0.7)'; ctx.fill();
  // scroll wings
  ctx.strokeStyle='rgba(200,160,30,0.7)'; ctx.lineWidth=1.8;
  [-1,1].forEach(d=>{
    ctx.beginPath(); ctx.moveTo(d*20,0);
    ctx.bezierCurveTo(d*32,-2,d*36,-14,d*26,-20); ctx.stroke();
    ctx.beginPath(); ctx.arc(d*26,-20,3,0,Math.PI*2);
    ctx.fillStyle='rgba(255,220,80,0.5)'; ctx.fill();
  });
  ctx.restore();
}

// ─── ROSES ─────────────────────────────────────────────────────
const PINK_L = ['#ffc8d2','#ffb8c8','#ffd0da','#ffe0e8'];
const PINK_M = ['#f090a8','#e87898','#f4a0b4','#f8b0c0'];
const RED_D  = ['#c01428','#a00a1c','#d01e32','#e02838'];
const CREAM  = ['#fff0ee','#fce8e4','#fff8f6','#f8e8e4'];

function rose(x, y, sz, palette, rot, alpha){
  if(sz < 4) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.globalAlpha = Math.min(1, alpha || 1);

  const p0 = palette[0], p1 = palette[1]||palette[0], p2 = palette[2]||palette[0];

  // ── drop shadow ──
  const sh = ctx.createRadialGradient(sz*0.08, sz*0.12, 0, sz*0.08, sz*0.12, sz*1.0);
  sh.addColorStop(0,'rgba(0,0,0,0.45)');
  sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.ellipse(sz*0.08, sz*0.1, sz*0.95, sz*0.45, 0, 0, Math.PI*2); ctx.fill();

  // ── outer petals (8) — filled + stroked edge ──
  for(let i = 0; i < 8; i++){
    const a = (i/8)*Math.PI*2;
    ctx.save(); ctx.rotate(a);
    // petal shape: pointed ellipse via bezier
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-sz*0.32, -sz*0.25, -sz*0.28, -sz*0.75, 0, -sz*0.88);
    ctx.bezierCurveTo( sz*0.28, -sz*0.75,  sz*0.32, -sz*0.25, 0, 0);
    ctx.closePath();
    // fill with gradient
    const pg = ctx.createLinearGradient(0, 0, 0, -sz*0.88);
    pg.addColorStop(0, darken(p0, 30));
    pg.addColorStop(0.4, p0);
    pg.addColorStop(1, lighten(p1, 18));
    ctx.fillStyle = pg; ctx.fill();
    // crisp petal edge
    ctx.strokeStyle = darken(p0, 40);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.restore();
  }

  // ── mid petals (6) ──
  for(let i = 0; i < 6; i++){
    const a = (i/6)*Math.PI*2 + (Math.PI/6);
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-sz*0.24, -sz*0.18, -sz*0.20, -sz*0.56, 0, -sz*0.65);
    ctx.bezierCurveTo( sz*0.20, -sz*0.56,  sz*0.24, -sz*0.18, 0, 0);
    ctx.closePath();
    const mg = ctx.createLinearGradient(0, 0, 0, -sz*0.65);
    mg.addColorStop(0, darken(p1, 25));
    mg.addColorStop(1, lighten(p1, 10));
    ctx.fillStyle = mg; ctx.fill();
    ctx.strokeStyle = darken(p1, 45);
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.restore();
  }

  // ── inner petals (4) ──
  for(let i = 0; i < 4; i++){
    const a = (i/4)*Math.PI*2 + (Math.PI/8);
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-sz*0.14, -sz*0.1, -sz*0.12, -sz*0.34, 0, -sz*0.40);
    ctx.bezierCurveTo( sz*0.12, -sz*0.34,  sz*0.14, -sz*0.1, 0, 0);
    ctx.closePath();
    ctx.fillStyle = darken(p0, 20); ctx.fill();
    ctx.strokeStyle = darken(p0, 50); ctx.lineWidth = 0.7; ctx.stroke();
    ctx.restore();
  }

  // ── centre ──
  ctx.beginPath(); ctx.arc(0, 0, sz*0.16, 0, Math.PI*2);
  ctx.fillStyle = darken(p0, 60); ctx.fill();
  ctx.strokeStyle = darken(p0, 75); ctx.lineWidth = 1; ctx.stroke();
  // centre highlight
  ctx.beginPath(); ctx.arc(-sz*0.05, -sz*0.05, sz*0.06, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,235,210,0.55)'; ctx.fill();

  ctx.restore();
}

function leaf(x, y, sz, angle, alpha){
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.globalAlpha = Math.min(1, (alpha||0.75) * 1.35); // boost opacity

  // leaf shape via bezier
  ctx.beginPath();
  ctx.moveTo(0, sz*0.15);
  ctx.bezierCurveTo(-sz*0.32, -sz*0.1, -sz*0.38, -sz*0.65, 0, -sz*0.92);
  ctx.bezierCurveTo( sz*0.38, -sz*0.65,  sz*0.32, -sz*0.1,  0,  sz*0.15);
  ctx.closePath();

  const lg = ctx.createLinearGradient(0, sz*0.15, 0, -sz*0.92);
  lg.addColorStop(0, '#1a3d0e');
  lg.addColorStop(0.45, '#2e6018');
  lg.addColorStop(1, '#1e4a10');
  ctx.fillStyle = lg; ctx.fill();
  // leaf outline
  ctx.strokeStyle = '#122808'; ctx.lineWidth = 1.1; ctx.stroke();

  // centre vein
  ctx.beginPath(); ctx.moveTo(0, sz*0.12); ctx.lineTo(0, -sz*0.88);
  ctx.strokeStyle = 'rgba(20,50,10,0.6)'; ctx.lineWidth = 0.9; ctx.stroke();
  // side veins
  for(let i=1;i<4;i++){
    const t = i/4;
    const vy = lerp(sz*0.12, -sz*0.88, t);
    const vx = sz*0.3*(1-t);
    ctx.beginPath(); ctx.moveTo(0,vy); ctx.lineTo(vx,vy-sz*0.12);
    ctx.strokeStyle='rgba(20,50,10,0.3)'; ctx.lineWidth=0.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,vy); ctx.lineTo(-vx,vy-sz*0.12); ctx.stroke();
  }
  ctx.restore();
}

function smallBlossom(x, y, sz, col, alpha){
  ctx.save(); ctx.translate(x, y);
  ctx.globalAlpha = Math.min(1, (alpha||0.7) * 1.4); // much more visible

  for(let i = 0; i < 5; i++){
    const a = (i/5)*Math.PI*2;
    ctx.save(); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-sz*0.22, -sz*0.15, -sz*0.20, -sz*0.55, 0, -sz*0.65);
    ctx.bezierCurveTo( sz*0.20, -sz*0.55,  sz*0.22, -sz*0.15, 0,  0);
    ctx.closePath();
    const pg = ctx.createLinearGradient(0, 0, 0, -sz*0.65);
    pg.addColorStop(0, darken(col, 20));
    pg.addColorStop(1, lighten(col, 15));
    ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = darken(col, 40); ctx.lineWidth = 0.7; ctx.stroke();
    ctx.restore();
  }
  // centre
  ctx.beginPath(); ctx.arc(0, 0, sz*0.2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,245,200,0.95)'; ctx.fill();
  ctx.strokeStyle = 'rgba(200,160,40,0.6)'; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
}

function twig(x,y,ang,len,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.globalAlpha = Math.min(1, (alpha||0.5) * 1.6);
  ctx.strokeStyle='#6a3a14'; ctx.lineWidth=1.6;
  let cx2=0,cy2=0;
  ctx.beginPath(); ctx.moveTo(0,0);
  for(let i=0;i<6;i++){
    const nx=cx2+(Math.random()-0.4)*10;
    const ny=cy2-len/6-Math.random()*6;
    ctx.lineTo(nx,ny);
    if(i>1){
      ctx.save(); ctx.translate(nx,ny); ctx.rotate((Math.random()-0.5)*1.4);
      ctx.lineTo(0,-len*0.15); ctx.restore();
    }
    cx2=nx; cy2=ny;
  }
  ctx.stroke(); ctx.restore();
}

function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function lerp(a,b,t){return a+(b-a)*t}

function drawAllRoses(){

  // leaves left — bigger, full alpha

// ─── CHANDELIER ────────────────────────────────────────────────
function drawChandelier(){
  const cx=W/2, scale=Math.min(W,H)/600;
  ctx.save(); ctx.translate(cx,0);

  // ceiling mount
  const mg=ctx.createLinearGradient(-30*scale,0,30*scale,0);
  mg.addColorStop(0,'#4a2c06'); mg.addColorStop(0.5,'#d4a030'); mg.addColorStop(1,'#4a2c06');
  ctx.fillStyle=mg;
  ctx.fillRect(-20*scale,0,40*scale,14*scale);

  // chain
  ctx.strokeStyle='#a07820'; ctx.lineWidth=2*scale;
  ctx.beginPath(); ctx.moveTo(0,14*scale); ctx.lineTo(0,42*scale); ctx.stroke();
  // chain links
  for(let i=0;i<4;i++){
    const y=16*scale+i*7*scale;
    ctx.strokeStyle='#c09828'; ctx.lineWidth=1.5*scale;
    ctx.beginPath(); ctx.ellipse(0,y,3*scale,4*scale,0,0,Math.PI*2); ctx.stroke();
  }

  // main crown body
  const cg=ctx.createLinearGradient(-50*scale,40*scale,50*scale,40*scale);
  cg.addColorStop(0,'#5a3808'); cg.addColorStop(0.2,'#d4a030');
  cg.addColorStop(0.5,'#ffe870'); cg.addColorStop(0.8,'#c89828'); cg.addColorStop(1,'#5a3808');
  ctx.fillStyle=cg;
  ctx.beginPath(); ctx.ellipse(0,44*scale,38*scale,11*scale,0,0,Math.PI*2); ctx.fill();
  // crown bottom
  ctx.beginPath(); ctx.ellipse(0,50*scale,28*scale,7*scale,0,0,Math.PI*2); ctx.fill();

  // arms (4 pairs)
  const armDefs=[
    {ax:-80*scale,ay:62*scale},{ax:-50*scale,ay:68*scale},
    {ax: 50*scale,ay:68*scale},{ax: 80*scale,ay:62*scale}
  ];
  armDefs.forEach(({ax,ay})=>{
    ctx.strokeStyle=cg; ctx.lineWidth=2.5*scale;
    ctx.beginPath(); ctx.moveTo(0,48*scale); ctx.quadraticCurveTo(ax*0.5,ay-8*scale,ax,ay); ctx.stroke();
    // bobeche (candle holder disc)
    ctx.fillStyle='#c09828';
    ctx.beginPath(); ctx.ellipse(ax,ay,6*scale,2.5*scale,0,0,Math.PI*2); ctx.fill();
    // candle
    ctx.fillStyle='rgba(255,248,220,0.92)';
    ctx.fillRect(ax-3*scale,ay-14*scale,6*scale,14*scale);
    // flame
    ctx.save(); ctx.translate(ax,ay-16*scale);
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.bezierCurveTo(-4*scale,-6*scale,-2*scale,-14*scale,0,-18*scale);
    ctx.bezierCurveTo(2*scale,-14*scale,4*scale,-6*scale,0,0);
    ctx.fillStyle='rgba(255,220,80,0.95)'; ctx.fill();
    // flame glow
    const flg=ctx.createRadialGradient(0,-10*scale,0,0,-10*scale,22*scale);
    flg.addColorStop(0,'rgba(255,230,120,0.35)'); flg.addColorStop(1,'rgba(255,150,30,0)');
    ctx.fillStyle=flg; ctx.beginPath(); ctx.arc(0,-10*scale,22*scale,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // centre drop rod
  ctx.strokeStyle=cg; ctx.lineWidth=2*scale;
  ctx.beginPath(); ctx.moveTo(0,50*scale); ctx.lineTo(0,88*scale); ctx.stroke();
  // bottom ornament
  ctx.beginPath(); ctx.ellipse(0,92*scale,5*scale,10*scale,0,0,Math.PI*2);
  const og=ctx.createLinearGradient(-5*scale,82*scale,5*scale,102*scale);
  og.addColorStop(0,'#ffe870'); og.addColorStop(1,'#8a5810');
  ctx.fillStyle=og; ctx.fill();
  // bottom candle
  ctx.fillStyle='rgba(255,248,220,0.92)';
  ctx.fillRect(-3.5*scale,102*scale,7*scale,14*scale);
  ctx.save(); ctx.translate(0,100*scale);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(-4*scale,-7*scale,-2*scale,-16*scale,0,-20*scale);
  ctx.bezierCurveTo(2*scale,-16*scale,4*scale,-7*scale,0,0);
  ctx.fillStyle='rgba(255,220,80,0.95)'; ctx.fill();
  const flg2=ctx.createRadialGradient(0,-10*scale,0,0,-10*scale,26*scale);
  flg2.addColorStop(0,'rgba(255,230,120,0.38)'); flg2.addColorStop(1,'rgba(255,150,30,0)');
  ctx.fillStyle=flg2; ctx.beginPath(); ctx.arc(0,-10*scale,26*scale,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // overall chandelier warm glow
  const chg=ctx.createRadialGradient(0,60*scale,0,0,60*scale,110*scale);
  chg.addColorStop(0,'rgba(255,200,80,0.12)');
  chg.addColorStop(1,'rgba(255,150,30,0)');
  ctx.fillStyle=chg; ctx.beginPath(); ctx.arc(0,60*scale,110*scale,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// ─── VIGNETTE ──────────────────────────────────────────────────
function drawVignette(){
  // heavy corners
  const vg=ctx.createRadialGradient(W/2,H*0.42,W*0.08,W/2,H*0.42,W*0.82);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.55,'rgba(0,0,0,0.15)');
  vg.addColorStop(1,'rgba(0,0,0,0.82)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // top bar dark
  const tg=ctx.createLinearGradient(0,0,0,H*0.06);
  tg.addColorStop(0,'rgba(0,0,0,0.7)'); tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg; ctx.fillRect(0,0,W,H*0.06);
}

// ─── INIT ──────────────────────────────────────────────────────
resize();

// ─── COUNTDOWN ─────────────────────────────────────────────────
let targetDate=null;
function getNextBirthday(v){
  if(!v)return null;
  const[,m,d]=v.split('-').map(Number);
  const now=new Date();
  let c=new Date(now.getFullYear(),m-1,d,0,0,0);
  if(c<=now)c=new Date(now.getFullYear()+1,m-1,d,0,0,0);
  return c;
}
function fmt(ms){
  if(ms<=0)return '🎂 Today! 🎂';
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sc=s%60;
  return `${d}d  ${String(h).padStart(2,'0')}h  ${String(m).padStart(2,'0')}m  ${String(sc).padStart(2,'0')}s`;
}
function tick(){
  const el=document.getElementById('countdownDisplay');
  if(!targetDate){el.textContent='set a birthday ↓';return;}
  const diff=targetDate-new Date();
  el.textContent=fmt(diff);
  if(diff<=0)targetDate=getNextBirthday(document.getElementById('bdayInput').value);
}
const saved=localStorage.getItem('bday_v3');
if(saved){document.getElementById('bdayInput').value=saved;targetDate=getNextBirthday(saved);}
document.getElementById('bdayInput').addEventListener('change',e=>{
  localStorage.setItem('bday_v3',e.target.value);
  targetDate=getNextBirthday(e.target.value);tick();
});
setInterval(tick,1000);tick();

document.getElementById('orbBtn').addEventListener('click',()=>document.getElementById('revealOverlay').classList.add('active'));
document.getElementById('closeReveal').addEventListener('click',()=>document.getElementById('revealOverlay').classList.remove('active'));
</script>
